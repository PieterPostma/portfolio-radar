<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f4f1;--surface:#fff;--line:#e1e3df;--text:#15181b;--muted:#5f666d;--accent:#2456c9;--crit:#c0302f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1214;--surface:#171b1e;--line:#2a3034;--text:#edf0f1;--muted:#9aa2a9;--accent:#7aa2ff;--crit:#f06a66;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Archivo",system-ui,"Segoe UI",sans-serif;display:grid;place-items:center;padding-inline:16px}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
h1{font:800 26px/1.1 "Archivo","Arial Narrow",sans-serif;font-variation-settings:"wdth" 72;text-transform:uppercase;margin:0 0 6px}
h1 span{color:var(--muted);font-weight:500}
p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:6px}
input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:500 15px "JetBrains Mono",ui-monospace,monospace;color:var(--text)}
input[type=password]:focus{outline:none;border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:13px;color:var(--muted)}
button{width:100%;padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--surface);font:600 15px "Archivo",system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--crit);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <h1>Portfolio Radar <span>/ web3</span></h1>
  <p>This dashboard is protected. Enter the password to continue.</p>
  <input type="text" name="username" value="portfolio-radar" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="row"><input id="remember" type="checkbox" checked><label for="remember" style="margin:0">Remember on this device</label></div>
  <button id="go" type="submit">Open</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var TX = { go: "Open", busy: "Decrypting…", bad: "Incorrect password.", net: "Could not load the protected data. Please try again." };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var toB64 = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };
  var KEY_ITEM = "portfolioRadarKey";

  function fetchBlob(path) {
    return fetch(path + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("net"); return r.text(); });
  }
  function decryptWith(key, text) {
    var o = JSON.parse(text);
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(o.iv) }, key, b64(o.ct)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function deriveKey(pw, blob) {
    var o = JSON.parse(blob);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(o.salt), iterations: o.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function storedKey() {
    var raw = null;
    try { raw = sessionStorage.getItem(KEY_ITEM) || localStorage.getItem(KEY_ITEM); } catch (e) {}
    if (!raw) return Promise.resolve(null);
    return crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, true, ["decrypt"]).catch(function () { return null; });
  }
  function forget() { try { sessionStorage.removeItem(KEY_ITEM); localStorage.removeItem(KEY_ITEM); } catch (e) {} }
  function launch(html) {
    window.__radarLock = function () { forget(); location.reload(); };
    document.open(); document.write(html); document.close();
  }

  var appBlob = fetchBlob("app.enc");
  // unlocked on this device before? Open straight away.
  Promise.all([storedKey(), appBlob]).then(function (r) {
    if (!r[0]) return;
    return decryptWith(r[0], r[1]).then(launch, forget);
  }).catch(function () {});

  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err"), pw = document.getElementById("pw").value;
    go.disabled = true; go.textContent = TX.busy; err.textContent = "";
    appBlob.catch(function () { appBlob = fetchBlob("app.enc"); return appBlob; }).then(function (blob) {
      return deriveKey(pw, blob).then(function (key) {
        return decryptWith(key, blob).then(function (html) {
          return crypto.subtle.exportKey("raw", key).then(function (raw) {
            try {
              forget();
              (document.getElementById("remember").checked ? localStorage : sessionStorage).setItem(KEY_ITEM, toB64(raw));
            } catch (e) {}
            launch(html);
          });
        }, function () { throw new Error("bad"); });
      });
    }).catch(function (e) {
      err.textContent = e && e.message === "bad" ? TX.bad : TX.net;
      go.disabled = false; go.textContent = TX.go;
      document.getElementById("pw").select();
    });
  });
})();
</script>
</body>
</html>
